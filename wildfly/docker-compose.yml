services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: crud_db
      MYSQL_USER: crud_user
      MYSQL_PASSWORD: crud_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-ui
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb

  wildfly:
    build:
      context: ..
      dockerfile: wildfly/Dockerfile
    container_name: wildfly-server
    ports:
      - "8080:8080"
      - "9990:9990" # Wildfly Management Console
    command:
      - bash
      - -c
      - |
        echo "Waiting for mariadb to be ready..."
        while ! timeout 1s bash -c 'echo > /dev/tcp/mariadb-db/3306' 2>/dev/null; do
          sleep 1
        done
        echo "MariaDB is ready, starting WildFly..."
        /opt/jboss/wildfly/bin/standalone.sh -c standalone-full.xml -b 0.0.0.0 -bmanagement 0.0.0.0
    depends_on:
      - mariadb

volumes:
  db_data: