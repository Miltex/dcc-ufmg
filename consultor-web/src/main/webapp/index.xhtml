<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Consultor</title>
</h:head>
<h:body>
    <h:form>
        <p:panel header="Bem-vindo ao Consultor">
            <h:panelGrid columns="2" cellpadding="5">
                <h:outputText value="Nome:" />
                <p:inputText id="name" value="#{bean.name}" />
                <p:commandButton value="Salvar" update="out" />
                <h:outputText id="out" value="Olá #{bean.name}!" />
            </h:panelGrid>
            <br/>
            <h:link outcome="cliente.xhtml" value="Cadastro de Clientes"/>
        </p:panel>
    </h:form>
</h:body>
</html>
